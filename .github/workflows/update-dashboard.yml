name: Update Dashboard

# Regenerates proposals, dashboard and review sheet whenever the human decisions change.
# The Wikidata fetch and the source-repo cross-check stay manual (they need live data and the
# local source repos): run `python scripts/run_pipeline.py --with fetch crosscheck` locally.
on:
  push:
    branches: [main]
    paths:
      - 'data/output/*/manual_review/decisions.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Proposals, dashboard, review sheet, tests
        run: python scripts/run_pipeline.py --from proposals

      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/ index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: proposals, dashboard and review sheet from decisions.csv"
            git push
          fi
