name: Update Dashboard

# Keeps the dashboard in step with the human decisions. Three ways in:
#   - schedule / manual run: pull the shared Google Sheet, rebuild decisions.csv from it, regenerate
#   - push of decisions.csv: regenerate from the file as committed (the sheet is NOT pulled, so a
#     hand-edited decisions.csv is never overwritten)
# The Wikidata fetch and the source-repo cross-check stay manual (they need live data and the
# local source repos): run `python scripts/run_pipeline.py --with fetch crosscheck` locally.
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/output/*/manual_review/decisions.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # Needs the repo secret REVIEW_SHEET_ID (the id in the sheet's URL, shared as "anyone with the link").
      # A validation error in the sheet (unknown decision, conflicting tabs, ...) fails the run on purpose.
      - name: Pull decisions from the Google Sheet
        if: github.event_name != 'push'
        env:
          REVIEW_SHEET_ID: ${{ secrets.REVIEW_SHEET_ID }}
        run: |
          if [ -z "$REVIEW_SHEET_ID" ]; then
            echo "REVIEW_SHEET_ID secret not set; skipping the sheet sync"
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/review_sheet.xlsx" \
            "https://docs.google.com/spreadsheets/d/${REVIEW_SHEET_ID}/export?format=xlsx"
          python scripts/import_decisions.py "$RUNNER_TEMP/review_sheet.xlsx"

      - name: Proposals, dashboard, review sheet, tests
        run: python scripts/run_pipeline.py --from proposals

      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/ index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: decisions, proposals and dashboard"
            git push
          fi
