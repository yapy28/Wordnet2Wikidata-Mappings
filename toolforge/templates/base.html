<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}WordNet review{% endblock %}</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#59636e; --card:#f6f8fa; --line:#d1d9e0; --accent:#0b57d0; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#151b23; --line:#30363d; --accent:#6ea8fe; --ok:#3fb950; --warn:#d29922; --bad:#f85149; } }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; margin:0; }
  main, header { max-width:960px; margin:0 auto; padding:0 16px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  a { color:var(--accent); } .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin:16px 0; }
  .pill { border-radius:10px; padding:1px 8px; font-size:12px; border:1px solid var(--line); }
  .accepted { color:var(--ok); } .conflict { color:var(--bad); } .pending { color:var(--warn); }
  pre { white-space:pre-wrap; margin:4px 0; font:inherit; }
  form.vote { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  select, input, button { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  .flash { background:var(--card); border-left:4px solid var(--ok); padding:6px 12px; margin:12px 0; }
</style>
</head>
<body>
<header>
  <a href="{{ url_for('index') }}"><b>WordNet to Wikidata review</b></a>
  <span>{% if user %}{{ user }} · <a href="{{ url_for('logout') }}">log out</a>{% else %}<a href="{{ url_for('login') }}">Log in with Wikimedia</a>{% endif %}</span>
</header>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
